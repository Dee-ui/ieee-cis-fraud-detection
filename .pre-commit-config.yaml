# The same checks CI runs, but on your machine when you type git commit.
# Same checks, caught earlier.
#
# After creating this file, run:
#     pre-commit install
#     pre-commit autoupdate
#
# autoupdate pins each hook to the latest release, which avoids guessing
# version tags that may not exist.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      # Blocks SSH and other private keys.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  # Strips notebook output before committing, so diffs stay readable.
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout

  # A local hook, meaning it runs a command on your machine rather than
  # pulling one from the internet. This one looks for anything shaped like
  # an API token in the files being committed.
  - repo: local
    hooks:
      - id: block-api-tokens
        name: block API tokens
        entry: python scripts/check_no_secrets.py
        language: system
        pass_filenames: true
